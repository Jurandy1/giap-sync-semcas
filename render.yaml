# Força o Render a usar Docker (imagem oficial do Puppeteer com Chrome).
# Sem isso, o deploy Node nativo sobe sem o Chrome e o job falha.
# Plano free = 512MB — lotes bem curtos + Chrome fecha a cada nome.
services:
  - type: web
    name: giap-sync-semcas
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUPPETEER_DOCKER
        value: "1"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=200 --expose-gc"
      - key: GIAP_MAX_BUSCAS_NOME
        value: "25"
      - key: GIAP_LOTE_WATCHDOG_MS
        value: "900000"
      - key: GIAP_MAX_VARIANTES_NOME
        value: "4"
      # Reusa o Chromium por várias buscas — corta o boot de ~8-15s por scrape.
      # Se voltar a OOMar, reduza para 1 (design de checkpoint garante retomada).
      - key: GIAP_HTTP_DIRECT
        value: "0"
      - key: GIAP_SCRAPE_TIMEOUT_MS
        value: "30000"
      - key: GIAP_RESTART_BROWSER_AFTER_N
        value: "10"
      - key: GIAP_BROWSER_RESTART_EVERY
        value: "10"
      - key: GIAP_CLOSE_BROWSER_EVERY_NOME
        value: "999"
      - key: GIAP_BULK_META
        value: "400"
      - key: GIAP_BULK_AZ
        value: "0"
      - key: GIAP_BULK_PREFIXOS_MAX
        value: "15"
      - key: GIAP_AUTO_CONTINUAR
        value: "1"
      - key: GIAP_CONTINUAR_DELAY_MS
        value: "5000"
      # Tamanho do checkpoint da Auditoria de Saídas (pessoas por lote).
      - key: GIAP_AUD_LOTE
        value: "25"
      # API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY: cadastre no Dashboard
